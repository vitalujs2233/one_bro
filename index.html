<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница-заглушка</title>
    <style>
        /* Основные стили — темно-серый фон */
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ЗАДНИЙ ФОН: Сетка из карточек девушек */
        .girls-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 колонки, как на твоих скриншотах */
            grid-auto-rows: 1fr;
            gap: 6px;
            padding: 6px;
            box-sizing: border-box;
            z-index: 1;
            /* Размытие для интриги и обхода модерации TikTok */
            filter: blur(5px) brightness(0.35); 
            opacity: 0.8;
        }

        .girl-card {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            border-radius: 6px;
            background-color: #2a2a2a; /* Цвет-заглушка */
        }

        /* ЦЕНТРАЛЬНЫЙ КОНТЕНТ (Поверх фоток) */
        .main-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            width: 100%;
            max-width: 340px;
            box-sizing: border-box;
        }

        /* Анимация пульсации для заголовков */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.03); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        h2 {
            font-size: 1.5rem;
            margin: 10px 0;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9); /* Тень для читаемости */
            animation: pulse 2s infinite ease-in-out; 
        }

        .subtitle {
            color: #aaaaaa;
            font-size: 0.9rem;
            margin-top: 15px;
            margin-bottom: 40px;
            text-shadow: 0 1px 5px rgba(0,0,0,0.9);
        }

        /* Контейнер для отпечатка пальца */
        .print-link {
            display: inline-block;
            text-decoration: none;
            color: inherit;
            -webkit-touch-callout: default !important; /* Важно для вызова меню iOS/TikTok */
        }

        /* Стилизация графического элемента отпечатка */
        .fingerprint-icon {
            width: 140px;
            height: 140px;
            background: rgba(26, 26, 26, 0.85);
            border: 2px dashed #555;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* Иконка SVG отпечатка пальца внутри круга */
        .fingerprint-icon svg {
            width: 75px;
            height: 75px;
            fill: #888888;
            transition: fill 0.3s;
            z-index: 2;
        }

        /* Зеленая заполняющаяся шкала */
        .fingerprint-icon::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(0deg, rgba(46, 204, 113, 0.7) 0%, rgba(46, 204, 113, 0.3) 100%);
            border-radius: 50%;
            transform: scale(0);
            transition: transform 0.8s ease-out; /* Скорость заполнения шкалы */
            z-index: 1;
        }

        /* Класс, который добавляется при зажатии */
        .print-link.holding .fingerprint-icon::after {
            transform: scale(1);
        }

        .print-link.holding svg {
            fill: #2ecc71;
        }

        /* Компактный блок верификации 18+ — замок в начале строки */
        .age-verification {
            display: flex;
            flex-direction: row; 
            align-items: center;
            justify-content: center;
            margin-top: 25px;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            max-width: 250px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .lock-icon {
            font-size: 1.2rem;
            margin-right: 10px;
            display: flex;
            align-items: center;
        }

        .verification-text {
            font-size: 0.8rem;
            color: #e0e0e0;
            line-height: 1.4;
            font-weight: 500;
            text-align: left;
        }

        .verification-text span {
            color: #ff3366;
            font-weight: bold;
        }
    </style>
</head>
