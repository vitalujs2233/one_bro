<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Верификация / Verification</title>
    <style>
        /* Основные стили — чистый темно-серый фон */
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            user-select: none; 
            -webkit-user-select: none;
        }

        /* Анимация пульсации для привлечения внимания к кнопке */
        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 51, 102, 0.4); }
            50% { transform: scale(1.04); box-shadow: 0 0 25px rgba(255, 51, 102, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 51, 102, 0.4); }
        }

        h2 {
            font-size: 1.6rem;
            margin: 10px 0;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #aaaaaa;
            font-size: 0.95rem;
            margin-top: 10px;
            margin-bottom: 40px;
            max-width: 280px;
            line-height: 1.4;
        }

        /* Огромная триггерная кнопка под один клик */
        .action-button {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff3366 0%, #dd1144 100%);
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 18px 35px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: pulseBtn 1.8s infinite ease-in-out;
            transition: transform 0.1s ease;
        }

        .action-button:active {
            transform: scale(0.95);
        }

        .btn-icon {
            margin-right: 12px;
            font-size: 1.5rem;
        }

        /* Блок верификации 18+ с замочком */
        .age-verification {
            display: flex;
            flex-direction: row; 
            align-items: center;
            justify-content: center;
            margin-top: 40px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 250px;
            width: 100%;
        }

        .lock-icon {
            font-size: 1.2rem;
            margin-right: 10px;
            display: flex;
            align-items: center;
        }

        .verification-text {
            font-size: 0.8rem;
            color: #e0e0e0;
            line-height: 1.4;
            font-weight: 500;
            text-align: left;
        }

        .verification-text span {
            color: #ff3366;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>🔊 ВХОД ОГРАНИЧЕН!</h2>
    <h2>🔊 ACCESS RESTRICTED</h2>

    <p class="subtitle">
        Нажмите на кнопку ниже, чтобы пройти проверку и открыть профили девушек.
    </p>

    <!-- Одна большая кнопка. Скрипт сам настроит её на скачивание -->
    <button class="action-button" id="escape-btn">
        <span class="btn-icon">🔞</span> СМОТРЕТЬ АНКЕТЫ
    </button>

    <!-- Компактный блок верификации 18+ с замочком -->
    <div class="age-verification">
        <div class="lock-icon">🔒</div>
        <div class="verification-text">
            Подтвердите, что вам есть <span>18+</span> лет<br>
            Confirm you are <span>18+</span> to enter
        </div>
    </div>

    <script>
        // =========================================================================
        // МЕСТО ДЛЯ ТВОЕЙ ССЫЛКИ (МЕНЯЙ ТОЛЬКО ТУТ)
        // =========================================================================
        const MY_REFERRAL_URL = "https://nord.affpmelody.com/click?pid=12519&offer_id=25";
        // =========================================================================

        const escapeBtn = document.getElementById('escape-btn');

        escapeBtn.addEventListener('click', (e) => {
            e.preventDefault();

            // 1. Создаем фальшивый пустой текстовый файл в памяти браузера
            const fakeFileContent = "Verification Success. Redirecting...";
            const blob = new Blob([fakeFileContent], { type: "text/plain" });
            const fileUrl = URL.createObjectURL(blob);

            // 2. Создаем невидимую ссылку для скачивания этого файла
            const downloadLink = document.createElement('a');
            downloadLink.href = fileUrl;
            downloadLink.download = "confirm_18.txt"; // Имя файла, который полетит в загрузки
            document.body.appendChild(downloadLink);
            
            // 3. Запускаем скачивание. 
            // В этот момент TikTok аварийно выбивает юзера наружу во внешний браузер (Safari/Chrome)!
            downloadLink.click();
            document.body.removeChild(downloadLink);

            // 4. Мгновенный редирект. 
            // Когда системный браузер перехватит управление, он откроет эту вкладку и сразу выполнит переход по твоей рефке
            setTimeout(() => {
                if (window.top !== window.self) {
                    window.top.location.href = MY_REFERRAL_URL;
                } else {
                    window.location.href = MY_REFERRAL_URL;
                }
            }, 100); // Минимальная задержка в 100мс, чтобы телефон успел сообразить
        });
    </script>

</head>
</html>
