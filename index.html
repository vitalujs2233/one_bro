<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница-заглушка</title>
    <style>
        /* Основные стили — темно-серый фон */
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            user-select: none; 
            -webkit-user-select: none;
        }

        /* Анимация пульсации для текста */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.03); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        h2 {
            font-size: 1.5rem;
            margin: 10px 0;
            font-weight: bold;
            letter-spacing: 0.5px;
            animation: pulse 2s infinite ease-in-out; 
        }

        .subtitle {
            color: #aaaaaa;
            font-size: 0.9rem;
            margin-bottom: 40px;
        }

        /* Контейнер для отпечатка пальца */
        .print-link {
            display: inline-block;
            text-decoration: none;
            color: inherit;
            -webkit-touch-callout: default; 
        }

        /* Стилизация графического элемента отпечатка */
        .fingerprint-icon {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #333 10%, transparent 60%);
            border: 2px dashed #555;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden; /* Чтобы шкала не вылезала за границы круга */
            cursor: pointer;
        }

        /* Зеленая заполняющаяся шкала (круг внутри круга) */
        .fingerprint-icon::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(46, 204, 113, 0.6); /* Зеленый цвет с прозрачностью */
            border-radius: 50%;
            transform: scale(0); /* Изначально размер 0 (скрыт) */
            transition: transform 1.5s linear; /* Время полного заполнения — 1.5 секунды */
            z-index: 1;
        }

        /* Класс, который будет добавляться через JavaScript при нажатии */
        .fingerprint-icon.holding::after {
            transform: scale(1); /* Круг вырастает до полных размеров */
        }

        /* Внутренний смайлик-палец (всегда поверх зеленого фона) */
        .fingerprint-icon::before {
            content: "☝️"; 
            font-size: 3rem;
            position: relative;
            z-index: 2; 
        }

        .print-text {
            font-size: 1.1rem;
            color: #ffffff;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>🔊 УДЕРЖИВАЙТЕ ПАЛЕЦ НА ОТПЕЧАТКЕ!</h2>
    <h2>🔊 PRESS AND HOLD YOUR FINGER ON THE PRINT</h2>

    <p class="subtitle">Выберите "Открыть ссылку (в браузере)" / choose "open link"</p>

    <!-- Ваша реферальная ссылка здесь -->
    <a href="https://nord.affpmelody.com/click?pid=12519&offer_id=25" class="print-link" id="target-link" target="_blank">
        <div class="fingerprint-icon" id="fingerprint"></div>
        <div class="print-text">Отпечаток пальца</div>
    </a>

    <script>
        const fingerprint = document.getElementById('fingerprint');
        const targetLink = document.getElementById('target-link');
        let holdTimeout;

        // Отключаем стандартный мгновенный переход по ссылке при клике, 
        // так как нам нужно именно удержание пальца
        targetLink.addEventListener('click', (e) => {
            e.preventDefault();
        });

        // Функция срабатывает, когда пользователь нажал и держит
        function startHold(e) {
            e.preventDefault();
            fingerprint.classList.add('holding'); // Запускаем CSS анимацию зеленого круга

            // Если пользователь удерживает палец 1.5 секунды (1500 миллисекунд), перенаправляем по ссылке
            holdTimeout = setTimeout(() => {
                window.open(targetLink.href, '_blank'); // Открываем вашу реферальную ссылку в новой вкладке
            }, 1500); 
        }

        // Функция срабатывает, если пользователь отпустил палец или убрал курсор
        function cancelHold() {
            clearTimeout(holdTimeout); // Отменяем таймер перехода
            fingerprint.classList.remove('holding'); // Сбрасываем зеленую шкалу назад в 0
        }

        // Слушатели для мобильных устройств и ПК (pointer события объединяют в себе touch и mouse)
        fingerprint.addEventListener('pointerdown', startHold);
        fingerprint.addEventListener('pointerup', cancelHold);
        fingerprint.addEventListener('pointerleave', cancelHold); // Если палец съехал с круга
    </script>

</body>
</html>
