<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Верификация / Verification</title>
    <style>
        body {
            background-color: #121212; /* Приятный темно-серый */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        /* Пульсация главного призыва */
        @keyframes textPulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .instruction-title {
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 5px 0;
            color: #ff3366; /* Яркий акцент для привлечения внимания */
            animation: textPulse 1.8s infinite ease-in-out;
        }

        .instruction-title.en {
            color: #ffffff;
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .subtitle {
            color: #aaaaaa;
            font-size: 0.95rem;
            line-height: 1.4;
            max-width: 290px;
            margin-bottom: 35px;
            background: rgba(255,255,255,0.05);
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Контейнер кнопки-сканера */
        .print-container {
            display: inline-block;
            position: relative;
            cursor: pointer;
        }

        .fingerprint-icon {
            width: 140px;
            height: 140px;
            background: #1a1a1a;
            border: 3px dashed #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transition: border-color 0.3s;
        }

        /* Свечение при наведении/нажатии */
        .fingerprint-icon:active {
            border-color: #00ff66;
        }

        /* SVG иконка отпечатка пальца */
        .fingerprint-icon svg {
            width: 75px;
            height: 75px;
            fill: #888888;
            transition: fill 0.3s;
            z-index: 2;
        }

        /* Зеленая заливка при удержании */
        .fingerprint-icon::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(0deg, rgba(0,255,102,0.6) 0%, rgba(0,255,102,0.2) 100%);
            transform: scale(0);
            transform-origin: center;
            border-radius: 50%;
            transition: transform 1.2s linear; /* Быстрое и плавное заполнение за 1.2 сек */
            z-index: 1;
        }

        /* Состояние анимации удержания */
        .print-container.holding .fingerprint-icon::after {
            transform: scale(1);
        }

        .print-container.holding svg {
            fill: #00ff66; /* Отпечаток становится зеленым */
        }

        .print-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        /* Подсказка внизу для тех, у кого не сработал автопереход */
        .hint-footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #666;
            max-width: 260px;
        }
    </style>
</head>
<body>

    <div class="instruction-title">👉 ЗАЖМИТЕ И УДЕРЖИВАЙТЕ!</div>
    <div class="instruction-title en">👉 PRESS AND HOLD FILTER</div>

    <div class="subtitle">
        Если ссылка блокируется: нажмите <b>( ••• )</b> в углу экрана TikTok и выберите <b>"Открыть в браузере"</b>
    </div>

    <!-- Область для клика/тапа -->
    <div class="print-container" id="scanner">
        <div class="fingerprint-icon">
            <!-- Красивый векторный отпечаток пальца вместо смайлика -->
            <svg viewBox="0 0 24 24">
                <path d="M12,2A10,10 0 0,0 2,12C2,16.42 4.87,20.17 8.84,21.5C9,21.55 9.17,21.5 9.29,21.37C9.41,21.25 9.47,21.08 9.44,20.91L9,18.5C10,19 11,19.25 12,19.25C13,19.25 14,19 15,18.5L14.56,20.91C14.53,21.08 14.59,21.25 14.71,21.37C14.83,21.5 15,21.55 15.16,21.5C19.13,20.17 22,16.42 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12C20,14.62 18.73,16.94 16.77,18.41L17.29,15.5C18.38,14.54 19,13.25 19,11.75A7,7 0 0,0 12,4.75A7,7 0 0,0 5,11.75C5,13.25 5.62,14.54 6.71,15.5L7.23,18.41C5.27,16.94 4,14.62 4,12A8,8 0 0,1 12,4M12,6.75A5,5 0 0,0 7,11.75C7,12.75 7.42,13.65 8.1,14.3L7.75,16.25C6.67,15.25 6,13.62 6,11.75A6,6 0 0,1 12,5.75A6,6 0 0,1 18,11.75C18,13.62 17.33,15.25 16.25,16.25L15.9,14.3C16.58,13.65 17,12.75 17,11.75A5,5 0 0,0 12,6.75M12,8.75A3,3 0 0,0 9,11.75C9,12.25 9.17,12.75 9.45,13.13L9.05,14.25C8.4,13.63 8,12.75 8,11.75A4,4 0 0,1 12,7.75A4,4 0 0,1 16,11.75C16,12.75 15.6,13.63 14.95,14.25L14.55,13.13C14.83,12.75 15,12.25 15,11.75A3,3 0 0,0 12,8.75M12,10.75A1,1 0 0,0 11,11.75A1,1 0 0,0 12,12.75A1,1 0 0,0 13,11.75A1,1 0 0,0 12,10.75Z"/>
            </svg>
        </div>
        <div class="print-text">HOLD TO ENTER</div>
    </div>

    <div class="hint-footer">
        🔒 Безопасное соединение. 18+ только.
    </div>

    <script>
        const scanner = document.getElementById('scanner');
        // Твоя ссылка вынесена в переменную для удобства
        const offerUrl = "https://affpmelody.com";
        let holdTimer;

        function startHold(e) {
            e.preventDefault();
            scanner.classList.add('holding');

            // Время удержания уменьшено до 1.2 секунд (1200 мс) для более быстрого пробива
            holdTimer = setTimeout(() => {
                
                // Пробуем жестко разорвать фрейм TikTok и открыться поверх
                if (window.top !== window.self) {
                    window.top.location.href = offerUrl;
                } else {
                    window.location.href = offerUrl;
                }
                
            }, 1200);
        }

        function endHold() {
            clearTimeout(holdTimer);
            scanner.classList.remove('holding');
        }

        // Поддержка мобильных тачей и мыши
        scanner.addEventListener('pointerdown', startHold);
        scanner.addEventListener('pointerup', endHold);
        scanner.addEventListener('pointerleave', endHold);
    </script>

</body>
</html>
