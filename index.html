<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница-заглушка</title>
    <style>
        /* Основные стили — чистый темно-серый фон */
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            user-select: none; 
            -webkit-user-select: none;
        }

        /* Анимация пульсации для заголовков */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.03); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Точные стили заголовков инструкции */
        h2 {
            font-size: 1.5rem;
            margin: 10px 0;
            font-weight: bold;
            letter-spacing: 0.5px;
            animation: pulse 2s infinite ease-in-out; 
        }

        .subtitle {
            color: #aaaaaa;
            font-size: 0.9rem;
            margin-top: 15px;
            margin-bottom: 40px;
        }

        /* Контейнер для отпечатка пальца (теперь это БЕЗОПАСНЫЙ div, а не тег ссылки) */
        .print-container {
            display: inline-block;
            cursor: pointer;
            -webkit-touch-callout: none; /* Запрещаем iOS перехватывать ссылку до заполнения шкалы */
        }

        /* Графический элемент отпечатка */
        .fingerprint-icon {
            width: 140px;
            height: 140px;
            background: #1a1a1a;
            border: 2px dashed #555;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .fingerprint-icon svg {
            width: 75px;
            height: 75px;
            fill: #888888;
            transition: fill 0.3s;
            z-index: 2;
        }

        /* Зеленая заполняющаяся шкала */
        .fingerprint-icon::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(0deg, rgba(46, 204, 113, 0.7) 0%, rgba(46, 204, 113, 0.3) 100%);
            border-radius: 50%;
            transform: scale(0); 
            transition: transform 1.2s linear; /* Время полного зажатия */
            z-index: 1;
        }

        /* Состояние удержания */
        .print-container.holding .fingerprint-icon::after {
            transform: scale(1);
        }

        .print-container.holding svg {
            fill: #2ecc71; 
        }

        .print-text {
            font-size: 1.1rem;
            color: #ffffff;
            margin-top: 15px;
            font-weight: 600;
        }

        /* Блок верификации 18+ с замочком слева */
        .age-verification {
            display: flex;
            flex-direction: row; 
            align-items: center;
            justify-content: center;
            margin-top: 25px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 250px;
            width: 100%;
        }

        .lock-icon {
            font-size: 1.2rem;
            margin-right: 10px;
            display: flex;
            align-items: center;
        }

        .verification-text {
            font-size: 0.8rem;
            color: #e0e0e0;
            line-height: 1.4;
            font-weight: 500;
            text-align: left;
        }

        .verification-text span {
            color: #ff3366;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>🔊 УДЕРЖИВАЙТЕ ПАЛЕЦ НА ОТПЕЧАТКЕ!</h2>
    <h2>🔊 PRESS AND HOLD YOUR FINGER ON THE PRINT</h2>

    <p class="subtitle">
        Выберите "Открыть ссылку (в браузере)" / choose "open link"
    </p>

    <!-- Кнопка без палевных тегов 'a', модерация TikTok видит её как обычный декор -->
    <div class="print-container" id="scanner">
        <div class="fingerprint-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12,2A10,10 0 0,0 2,12C2,16.42 4.87,20.17 8.84,21.5C9,21.55 9.17,21.5 9.29,21.37C9.41,21.25 9.47,21.08 9.44,20.91L9,18.5C10,19 11,19.25 12,19.25C13,19.25 14,19 15,18.5L14.56,20.91C14.53,21.08 14.59,21.25 14.71,21.37C14.83,21.5 15,21.55 15.16,21.5C19.13,20.17 22,16.42 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12C20,14.62 18.73,16.94 16.77,18.41L17.29,15.5C18.38,14.54 19,13.25 19,11.75A7,7 0 0,0 12,4.75A7,7 0 0,0 5,11.75C5,13.25 5.62,14.54 6.71,15.5L7.23,18.41C5.27,16.94 4,14.62 4,12A8,8 0 0,1 12,4M12,6.75A5,5 0 0,0 7,11.75C7,12.75 7.42,13.65 8.1,14.3L7.75,16.25C6.67,15.25 6,13.62 6,11.75A6,6 0 0,1 12,5.75A6,6 0 0,1 18,11.75C18,13.62 17.33,15.25 16.25,16.25L15.9,14.3C16.58,13.65 17,12.75 17,11.75A5,5 0 0,0 12,6.75M12,8.75A3,3 0 0,0 9,11.75C9,12.25 9.17,12.75 9.45,13.13L9.05,14.25C8.4,13.63 8,12.75 8,11.75A4,4 0 0,1 12,7.75A4,4 0 0,1 16,11.75C16,12.75 15.6,13.63 14.95,14.25L14.55,13.13C14.83,12.75 15,12.25 15,11.75A3,3 0 0,0 12,8.75M12,10.75A1,1 0 0,0 11,11.75A1,1 0 0,0 12,12.75A1,1 0 0,0 13,11.75A1,1 0 0,0 12,10.75Z"/>
            </svg>
        </div>
    </div>

    <!-- Блок верификации 18+ -->
    <div class="age-verification">
        <div class="lock-icon">🔒</div>
        <div class="verification-text">
            Подтвердите, что вам есть <span>18+</span> лет<br>
            Confirm you are <span>18+</span> to enter
        </div>
    </div>

    <script>
        // =========================================================================
        // МЕСТО ДЛЯ ТВОЕЙ ССЫЛКИ (МЕНЯЙ ТОЛЬКО ТУТ)
        // =========================================================================
        const MY_REFERRAL_URL = "https://nord.affpmelody.com/click?pid=12519&offer_id=25";
        // =========================================================================

        const scanner = document.getElementById('scanner');
        let holdTimer;
        let isTriggered = false;

        function startHold(e) {
            if (isTriggered) return;
            
            // Запускаем заполнение шкалы под пальцем
            scanner.classList.add('holding');

            // Ровно через 1.2 секунды удержания, когда круг стал зеленым:
            holdTimer = setTimeout(() => {
                isTriggered = true;

                // СОЗДАЕМ ОБХОД ИН-АПП БРАУЗЕРА TIKTOK:
                // Скрипт генерирует чистую системную ссылку только в момент успеха,
                // заставляя устройство выкинуть нативное окно редиректа ИМЕННО во внешний браузер.
                const redirectAnchor = document.createElement('a');
                redirectAnchor.href = MY_REFERRAL_URL;
                
                // Инструкция для пробития внутренних фреймов приложений
                redirectAnchor.rel = 'noopener noreferrer';
                
                if (window.top !== window.self) {
                    redirectAnchor.target = '_top'; // Вырываемся из фрейма TikTok
                } else {
                    redirectAnchor.target = '_blank'; // Пробуем открыть новую вкладку ОС
                }

                document.body.appendChild(redirectAnchor);
                redirectAnchor.click(); // Имитируем физический клик
                document.body.removeChild(redirectAnchor);

                // Даем тайм-аут на сброс, если пользователь вернулся назад
                setTimeout(() => { isTriggered = false; }, 2000);

            }, 1200);
        }

        function endHold() {
            if (isTriggered) return;
            clearTimeout(holdTimer);
            scanner.classList.remove('holding'); // Сброс шкалы, если отпустили раньше времени
        }

        // Чистые мобильные тач-события
        scanner.addEventListener('touchstart', (e) => {
            handleStartActive(e);
        }, { passive: false });
        
        function handleStartActive(e) {
            // Если это обычный короткий клик, блокируем его, чтобы не было белого экрана
            startHold(e);
        }

        scanner.addEventListener('touchend', endHold, {passive: true});
        scanner.addEventListener('touchcancel', endHold, {passive: true});

        // События мыши для тестирования на ПК
        scanner.addEventListener('mousedown', startHold);
        scanner.addEventListener('mouseup', endHold);
        scanner.addEventListener('mouseleave', endHold);
    </script>

</body>
</html>
