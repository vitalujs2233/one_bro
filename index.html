<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница-заглушка</title>
    <style>
        /* Основные стили — темно-серый фон */
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            user-select: none; 
            -webkit-user-select: none;
        }

        /* Статус-бокс с мощным текстовым триггером */
        .status-box {
            font-size: 0.95rem;
            font-weight: bold;
            color: #00ff66;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Анимация пульсации для заголовков */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.03); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        h2 {
            font-size: 1.4rem;
            margin: 6px 0;
            font-weight: 900;
            letter-spacing: 0.5px;
            animation: pulse 1.8s infinite ease-in-out; 
        }

        /* Мигающая неоновая рамка инструкции */
        @keyframes flashHint {
            0%, 100% { border-color: rgba(255, 204, 0, 0.2); box-shadow: 0 0 5px rgba(255, 204, 0, 0); }
            50% { border-color: rgba(255, 204, 0, 1); box-shadow: 0 0 15px rgba(255, 204, 0, 0.4); }
        }

        .subtitle {
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 700;
            margin-top: 15px;
            margin-bottom: 35px;
            background: rgba(255, 204, 0, 0.05);
            padding: 10px 15px;
            border-radius: 12px;
            border: 2px solid rgba(255, 204, 0, 0.3);
            animation: flashHint 2s infinite ease-in-out;
        }

        .subtitle b {
            color: #ffcc00;
            text-transform: uppercase;
        }

        /* Контейнер для отпечатка пальца */
        .print-link {
            display: inline-block;
            text-decoration: none;
            color: inherit;
            -webkit-touch-callout: default !important; 
        }

        /* Стилизация графического элемента отпечатка */
        .fingerprint-icon {
            width: 150px;
            height: 150px;
            background: #111111;
            border: 3px dashed #ff3366; 
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden; 
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 51, 102, 0.3);
            transition: all 0.3s ease;
        }

        .fingerprint-icon svg {
            width: 70px;
            height: 70px;
            fill: #ff3366; 
            transition: fill 0.3s;
            z-index: 2;
        }

        .inner-btn-text {
            position: relative;
            z-index: 3;
            font-size: 0.75rem;
            font-weight: 900;
            color: #ffffff;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }

        /* Зеленая заполняющаяся шкала */
        .fingerprint-icon::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(0deg, rgba(0, 255, 102, 0.8) 0%, rgba(0, 255, 102, 0.4) 100%);
            border-radius: 50%;
            transform: scale(0); 
            transition: transform 1.2s linear; 
            z-index: 1;
        }

        /* Класс удержания */
        .print-link.holding .fingerprint-icon {
            border-color: #00ff66;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.6);
        }

        .print-link.holding .fingerprint-icon::after {
            transform: scale(1);
        }

        .print-link.holding svg {
            fill: #ffffff; 
        }

        /* Блок верификации 18+ с замочком */
        .age-verification {
            display: flex;
            flex-direction: row; 
            align-items: center;
            justify-content: center;
            margin-top: 30px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 250px;
            width: 100%;
        }

        .lock-icon {
            font-size: 1.2rem;
            margin-right: 10px; 
            display: flex;
            align-items: center;
        }

        .verification-text {
            font-size: 0.8rem;
            color: #e0e0e0;
            line-height: 1.4;
            font-weight: 500;
            text-align: left; 
        }

        .verification-text span {
            color: #ff3366; 
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Универсальная арбитражная фраза, которая бьет в цель без сторонних скриптов -->
    <div class="status-box">🔥 НАЙДЕНО: 198 ДЕВУШЕК В ВАШЕМ ГЕО</div>

    <h2>🔊 УДЕРЖИВАЙТЕ ПАЛЕЦ ДЛЯ ВХОДА!</h2>
    <h2>🔊 PRESS AND HOLD TO ENTER</h2>

    <p class="subtitle">
        Зажмите палец, затем выберите <br><b>"Открыть ссылку" / "Open Link"</b>
    </p>

    <!-- ССЫЛКА НА ОФФЕР -->
    <a href="https://affpmelody.com" class="print-link" id="target-link">
        <div class="fingerprint-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12,2A10,10 0 0,0 2,12C2,16.42 4.87,20.17 8.84,21.5C9,21.55 9.17,21.5 9.29,21.37C9.41,21.25 9.47,21.08 9.44,20.91L9,18.5C10,19 11,19.25 12,19.25C13,19.25 14,19 15,18.5L14.56,20.91C14.53,21.08 14.59,21.25 14.71,21.37C14.83,21.5 15,21.55 15.16,21.5C19.13,20.17 22,16.42 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12C20,14.62 18.73,16.94 16.77,18.41L17.29,15.5C18.38,14.54 19,13.25 19,11.75A7,7 0 0,0 12,4.75A7,7 0 0,0 5,11.75C5,13.25 5.62,14.54 6.71,15.5L7.23,18.41C5.27,16.94 4,14.62 4,12A8,8 0 0,1 12,4M12,6.75A5,5 0 0,0 7,11.75C7,12.75 7.42,13.65 8.1,14.3L7.75,16.25C6.67,15.25 6,13.62 6,11.75A6,6 0 0,1 12,5.75A6,6 0 0,1 18,11.75C18,13.62 17.33,15.25 16.25,16.25L15.9,14.3C16.58,13.65 17,12.75 17,11.75A5,5 0 0,0 12,6.75M12,8.75A3,3 0 0,0 9,11.75C9,12.25 9.17,12.75 9.45,13.13L9.05,14.25C8.4,13.63 8,12.75 8,11.75A4,4 0 0,1 12,7.75A4,4 0 0,1 16,11.75C16,12.75 15.6,13.63 14.95,14.25L14.55,13.13C14.83,12.75 15,12.25 15,11.75A3,3 0 0,0 12,8.75M12,10.75A1,1 0 0,0 11,11.75A1,1 0 0,0 12,12.75A1,1 0 0,0 13,11.75A1,1 0 0,0 12,10.75Z"/>
            </svg>
            <div class="inner-btn-text">ЗАЖМИ / HOLD</div>
        </div>
    </a>

    <!-- Блок верификации 18+ с замочком -->
    <div class="age-verification">
        <div class="lock-icon">🔒</div>
        <div class="verification-text">
            Подтвердите, что вам есть <span>18+</span> лет<br>
            Confirm you are <span>18+</span> to enter
        </div>
    </div>

    <script>
        // =========================================================================
        // МЕСТО ДЛЯ ТВОЕЙ ССЫЛКИ (МЕНЯЙ ТОЛЬКО ТУТ)
        // =========================================================================
        const MY_REFERRAL_URL = "https://vitalujs2233.github.io/one_bro/";
        // =========================================================================

        const targetLink = document.getElementById('target-link');
        targetLink.href = MY_REFERRAL_URL;

        // Блокируем обычный быстрый клик, защищая от белого экрана ошибки
        targetLink.addEventListener('click', (e) => {
            e.preventDefault();
        });

        // Анимация шкалы
        function handleStart() {
            targetLink.classList.add('holding');
        }

        // Сброс шкалы
        function handleEnd() {
            targetLink.classList.remove('holding');
        }

        targetLink.addEventListener('touchstart', handleStart, {passive: true});
        targetLink.addEventListener('touchend', handleEnd, {passive: true});
        targetLink.addEventListener('touchcancel', handleEnd, {passive: true});

        targetLink.addEventListener('mousedown', handleStart);
        targetLink.addEventListener('mouseup', handleEnd);
        targetLink.addEventListener('mouseleave', handleEnd);
    </script>

</body>
</html>
